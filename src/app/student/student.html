<mat-toolbar color="primary">
    Student Management
</mat-toolbar>

<div class="page-content">
    @if (!isAddView) {
        <mat-card>
            <div class="toolbar-row">
                <button mat-raised-button color="primary" type="button" (click)="showAddView()">Add Student</button>
            </div>

            <p-table [value]="students" >
                <ng-template pTemplate="header">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Grade</th>
                        <th>Department</th>
                        <th>Enrollment</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-student>
                    <tr>
                        <td>{{ student.id }}</td>
                        <td>{{ student.name }}</td>
                        <td>{{ student.age }}</td>
                        <td>{{ student.grade }}</td>
                        <td>{{ student.department }}</td>
                        <td>{{ formatDate(student.enrollmentDate) }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </mat-card>
    } @else {
        <mat-card>
            <h3>Add New Student</h3>
            <form class="student-form" (ngSubmit)="addStudent()">
                <div class="field">
                    <mat-form-field appearance="outline">
                        <mat-label>Name</mat-label>
                        <input matInput id="name" name="name" type="text" [(ngModel)]="newStudent.name" />
                    </mat-form-field>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <p-inputnumber
                        inputId="age"
                        name="age"
                        [(ngModel)]="newStudent.age"
                        [min]="1"
                    ></p-inputnumber>
                </div>

               <div class="field">
                    <label for="grade">Grade</label>
                    <input id="grade" pInputText name="grade" type="text" maxlength="1" [(ngModel)]="newStudent.grade" />
                </div>

                <div class="field">
                    <label for="department">Department</label>
                    <p-select
                        inputId="department"
                        name="department"
                        [options]="departmentOptions"
                        optionLabel="label"
                        optionValue="value"
                        placeholder="Select department"
                        [(ngModel)]="newStudent.department"
                    ></p-select>
                </div>

                <div class="field">
                    <label for="enrollmentDate">Enrollment Date</label>
                    <p-datepicker
                        inputId="enrollmentDate"
                        name="enrollmentDate"
                        [(ngModel)]="newStudent.enrollmentDate"
                        [showIcon]="true"
                        dateFormat="yy-mm-dd"
                    ></p-datepicker>
                </div>

                <div class="actions">
                    <button mat-raised-button color="primary" type="submit">Save</button>
                    <button mat-stroked-button type="button" (click)="showListView()">Cancel</button>
                </div>
            </form>
        </mat-card>
    }
</div>
